# 1. Build
- name: Build API
  run: npm run build:api

# 2. Criar pacote limpo só da API
- name: Prepare deployment folder
  run: |
    rm -rf deploy
    mkdir deploy

    cp -r apps/api/dist deploy/dist
    cp apps/api/package.json deploy/
    cp apps/api/package-lock.json deploy/

# 3. Instalar dependências de produção no pacote
- name: Install production deps
  run: |
    cd deploy
    npm ci --omit=dev

# 4. Zip SOMENTE da API
- name: Zip package
  run: |
    cd deploy
    zip -r ../release.zip .

# 5. Deploy
- name: Deploy to Azure
  uses: azure/webapps-deploy@v3
  with:
    app-name: ${{ secrets.AZURE_APP_NAME }}
    package: release.zip