
"""Exposes a URL that specifies the behavior of this scalar."""
directive @specifiedBy(
  """The URL that specifies the behavior of this scalar."""
  url: String!
) on SCALAR

"""
Indicates exactly one field must be supplied and this field must not be `null`.
"""
directive @oneOf on INPUT_OBJECT

type AuthToken {
  accessToken: String!
  tokenType: String!
}

type Category {
  id: String!
  title: String!
  description: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  products: [Product!]!
}

input CreateCategoryInput {
  title: String!
  description: String!
}

input CreateDeliveryFeeInput {
  distance: Float!
  value: Float!
}

input CreateMercadoPagoPreferenceInput {
  subscriptionId: String!
  successUrl: String
  failureUrl: String
  pendingUrl: String
  notificationUrl: String
}

input CreateProductInput {
  title: String!
  description: String!
  photoUrl: String!
  price: Float!
  categoryId: String
}

input CreateSubscriptionInput {
  title: String!
  description: String!
  price: Float!
}

input CreateUserAddressInput {
  street: String!
  number: String!
  complement: String
  neighborhood: String!
  city: String!
  state: String!
  zipCode: String!
}

input CreateUserAdminAddressInput {
  street: String!
  number: String!
  complement: String
  neighborhood: String!
  city: String!
  state: String!
  zipCode: String!
}

input CreateUserAdminInput {
  email: String!
  name: String!
  password: String!
}

input CreateUserInput {
  email: String!
  name: String!
  password: String!
  profile: UserProfile
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type DeliveryFee {
  id: String!
  userAdminId: String!
  distance: Float!
  value: Float!
  userAdmin: UserAdmin!
}

type MercadoPagoPreference {
  id: String!
  initPoint: String!
  sandboxInitPoint: String
  userAdminSubscriptionId: String!
}

type Mutation {
  loginAdmin(email: String!, password: String!): AuthToken!
  createUserAdmin(data: CreateUserAdminInput!): UserAdmin!
  updateUserAdmin(id: String!, data: UpdateUserAdminInput!): UserAdmin!
  deleteUserAdmin(id: String!): UserAdmin!
  login(email: String!, password: String!): AuthToken!
  createUser(data: CreateUserInput!): User!
  updateUser(id: String!, data: UpdateUserInput!): User!
  deleteUser(id: String!): User!
  createCategory(data: CreateCategoryInput!): Category!
  updateCategory(id: String!, data: UpdateCategoryInput!): Category!
  deleteCategory(id: String!): Category!
  createDeliveryFee(data: CreateDeliveryFeeInput!): DeliveryFee!
  updateDeliveryFee(id: String!, data: UpdateDeliveryFeeInput!): DeliveryFee!
  deleteDeliveryFee(id: String!): DeliveryFee!
  createMercadoPagoPreference(data: CreateMercadoPagoPreferenceInput!): MercadoPagoPreference!
  cancelMercadoPagoSubscription: UserAdminSubscriptions!
  changeMercadoPagoSubscriptionPlan(data: CreateMercadoPagoPreferenceInput!): MercadoPagoPreference!
  createProduct(data: CreateProductInput!): Product!
  updateProduct(id: String!, data: UpdateProductInput!): Product!
  deleteProduct(id: String!): Product!
  createSubscription(data: CreateSubscriptionInput!): Subscription!
  updateSubscription(id: String!, data: UpdateSubscriptionInput!): Subscription!
  deleteSubscription(id: String!): Subscription!
  createUserAddress(data: CreateUserAddressInput!): UserAddress!
  updateUserAddress(id: String!, data: UpdateUserAddressInput!): UserAddress!
  deleteUserAddress(id: String!): UserAddress!
  createUserAdminAddress(data: CreateUserAdminAddressInput!): UserAdminAddress!
  updateUserAdminAddress(id: String!, data: UpdateUserAdminAddressInput!): UserAdminAddress!
  deleteUserAdminAddress(id: String!): UserAdminAddress!
}

type Product {
  id: String!
  title: String!
  description: String!
  photoUrl: String
  price: Float!
  categoryId: String!
  category: Category!
}

type Query {
  health: String!
  getMeAdmin: UserAdmin!
  usersAdmin: [UserAdmin!]!
  userAdmin(id: String!): UserAdmin
  me: User!
  users: [User!]!
  user(id: String!): User
  categories: [Category!]!
  category(id: String!): Category
  deliveryFees: [DeliveryFee!]!
  deliveryFee(id: String!): DeliveryFee
  pendingMercadoPagoPreference: MercadoPagoPreference!
  products: [Product!]!
  product(id: String!): Product
  subscriptions: [Subscription!]!
  subscription(id: String!): Subscription
  userAddresses: [UserAddress!]!
  userAddress(id: String!): UserAddress
  userAdminAddresses: [UserAdminAddress!]!
  userAdminAddress(id: String!): UserAdminAddress
}

type Subscription {
  id: String!
  title: String!
  description: String!
  price: Float!
}

input UpdateCategoryInput {
  title: String
  description: String
}

input UpdateDeliveryFeeInput {
  distance: Float
  value: Float
}

input UpdateProductInput {
  title: String
  description: String
  photoUrl: String
  price: Float
  categoryId: String
}

input UpdateSubscriptionInput {
  title: String
  description: String
  price: Float
}

input UpdateUserAddressInput {
  street: String
  number: String
  complement: String
  neighborhood: String
  city: String
  state: String
  zipCode: String
}

input UpdateUserAdminAddressInput {
  street: String
  number: String
  complement: String
  neighborhood: String
  city: String
  state: String
  zipCode: String
}

input UpdateUserAdminInput {
  email: String
  name: String
  password: String
}

input UpdateUserInput {
  email: String
  name: String
  password: String
  profile: UserProfile
}

type User {
  id: String!
  email: String!
  name: String!
  profile: UserProfile!
  addresses: [UserAddress!]!
}

type UserAddress {
  id: String!
  userId: String!
  street: String!
  number: String!
  complement: String
  neighborhood: String!
  city: String!
  state: String!
  zipCode: String!
  latitude: Float
  longitude: Float
  user: User!
}

type UserAdmin {
  id: String!
  email: String!
  name: String!
  addresses: [UserAdminAddress!]!
  deliveryFees: [DeliveryFee!]!
}

type UserAdminAddress {
  id: String!
  userAdminId: String!
  street: String!
  number: String!
  complement: String
  neighborhood: String!
  city: String!
  state: String!
  zipCode: String!
  latitude: Float
  longitude: Float
  userAdmin: UserAdmin!
}

type UserAdminSubscriptions {
  id: String!
  userAdminId: String!
  mercadoPagoId: String!
  subscriptionsId: String!
  status: UserAdminSubscriptionStatus!
  userAdmin: UserAdmin!
  subscription: Subscription!
}

enum UserAdminSubscriptionStatus {
  Active
  Pending
  Cancelled
  Expired
}

enum UserProfile {
  User
}
