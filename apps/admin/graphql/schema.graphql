type User {
  id: String!
  email: String!
  name: String!
  profile: UserProfile!
}

type UserAdmin {
  id: String!
  email: String!
  name: String!
}

enum UserProfile {
  User
}

type AuthToken {
  accessToken: String!
  tokenType: String!
}

type Query {
  health: String!
  me: User!
  getMeAdmin: UserAdmin!
}

type Mutation {
  login(email: String!, password: String!): AuthToken!
  loginAdmin(email: String!, password: String!): AuthToken!
}
