<section class="table-detail-page">
  <div class="table-detail-page__header">
    <div>
      <h1>{{ tableId ? 'Editar mesa' : 'Criar mesa' }}</h1>
      <p>{{ tableId ? 'Altere os dados da mesa.' : 'Cadastre uma nova mesa.' }}</p>
    </div>

    <a class="btn btn-outline-dark" routerLink="/table">Voltar</a>
  </div>

  <form
    class="table-detail-page__form"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <div *ngIf="isLoading" class="alert alert-secondary py-2">
      Carregando mesa...
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger py-2">
      {{ errorMessage }}
    </div>

    <div class="mb-3">
      <label for="storeId" class="form-label fw-semibold">Loja</label>
      <select
        id="storeId"
        class="form-select"
        formControlName="storeId"
      >
        <option value="" disabled>Selecione uma loja</option>
        <option
          *ngFor="let store of storeService.stores()"
          [value]="store.id"
        >
          {{ store.name }}
        </option>
      </select>
      <div
        *ngIf="form.controls['storeId'].invalid && form.controls['storeId'].touched"
        class="form-text text-danger"
      >
        Selecione uma loja.
      </div>
      <a class="d-inline-block mt-1" routerLink="/store/create">Criar loja</a>
    </div>

    <div class="mb-3">
      <label for="name" class="form-label fw-semibold">Nome</label>
      <input
        id="name"
        type="text"
        class="form-control"
        formControlName="name"
      />
      <div
        *ngIf="form.controls['name'].invalid && form.controls['name'].touched"
        class="form-text text-danger"
      >
        Informe o nome da mesa.
      </div>
    </div>

    <div class="table-detail-page__actions">
      <a class="btn btn-outline-secondary" routerLink="/table">Cancelar</a>
      <button
        type="submit"
        class="btn btn-dark"
        [disabled]="isSubmitting"
      >
        {{ isSubmitting ? 'Salvando...' : 'Salvar mesa' }}
      </button>
    </div>
  </form>
</section>
