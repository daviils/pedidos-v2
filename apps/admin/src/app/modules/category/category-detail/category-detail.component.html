<section class="category-detail-page">
  <div class="category-detail-page__header">
    <div>
      <h1>{{ categoryId ? 'Editar categoria' : 'Criar categoria' }}</h1>
      <p>{{ categoryId ? 'Altere os dados da categoria.' : 'Cadastre uma nova categoria.' }}</p>
    </div>

    <a class="btn btn-outline-dark" routerLink="/category">Voltar</a>
  </div>

  <form
    class="category-detail-page__form"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <div *ngIf="isLoading" class="alert alert-secondary py-2">
      Carregando categoria...
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger py-2">
      {{ errorMessage }}
    </div>

    <div class="mb-3">
      <label for="storeId" class="form-label fw-semibold">Loja</label>
      <select
        id="storeId"
        class="form-select"
        formControlName="storeId"
      >
        <option value="" disabled>Selecione uma loja</option>
        <option
          *ngFor="let store of storeService.stores()"
          [value]="store.id"
        >
          {{ store.name }}
        </option>
      </select>
      <div
        *ngIf="form.controls['storeId'].invalid && form.controls['storeId'].touched"
        class="form-text text-danger"
      >
        Selecione uma loja.
      </div>
      <a class="d-inline-block mt-1" routerLink="/store/create">Criar loja</a>
    </div>

    <div class="mb-3">
      <label for="title" class="form-label fw-semibold">Titulo</label>
      <input
        id="title"
        type="text"
        class="form-control"
        formControlName="title"
      />
      <div
        *ngIf="form.controls['title'].invalid && form.controls['title'].touched"
        class="form-text text-danger"
      >
        Informe o titulo da categoria.
      </div>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label fw-semibold">Descricao</label>
      <textarea
        id="description"
        class="form-control"
        rows="4"
        formControlName="description"
      ></textarea>
      <div
        *ngIf="form.controls['description'].invalid && form.controls['description'].touched"
        class="form-text text-danger"
      >
        Informe a descricao da categoria.
      </div>
    </div>

    <div class="category-detail-page__actions">
      <a class="btn btn-outline-secondary" routerLink="/category">Cancelar</a>
      <button
        type="submit"
        class="btn btn-dark"
        [disabled]="isSubmitting"
      >
        {{ isSubmitting ? 'Salvando...' : 'Salvar categoria' }}
      </button>
    </div>
  </form>
</section>
